name: Hot News Crawler

on:
  schedule:
    # 我们使用的是 github 官方提供的资源来进行的推送，而每个账号的资源是限额的，为了不被官方判定为滥用而面临封号的风险，不建议比半小时更低
    - cron: "0 * * * *" # 每小时整点运行一次(实际有偏差) 或者 "*/30 * * * *" (每半小时执行一次) 或者 "*/30 0-14 * * *"(每天早上 8 点到晚上 10 点期间，每半小时运行一次)
  workflow_dispatch:

# 添加权限设置
permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install system dependencies
        run: |
          echo "🔄 更新包列表..."
          for i in {1..3}; do
            sudo apt-get update && break || sleep 10
          done
          
          echo "📦 安装系统依赖..."
          sudo apt-get install -y \
            libgbm-dev \
            libnss3 \
            libatk-bridge2.0-0 \
            libxkbcommon-x11-0 \
            libxcomposite1 \
            libxrandr2 \
            libxdamage1 \
            libxfixes3 \
            libxi6 \
            libxtst6 \
            libxss1 \
            libgtk-3-0 \
            libasound2t64 || echo "⚠️  部分依赖安装失败，尝试继续执行"
          
          echo "✅ 系统依赖安装完成"

      - name: Install Python dependencies
        run: |
          echo "🐍 安装Python依赖..."
          python -m pip install --upgrade pip
          
          echo "📋 从requirements.txt安装包..."
          for i in {1..3}; do
            pip install -r requirements.txt && break || {
              echo "⚠️  第$i次安装失败，10秒后重试..."
              sleep 10
            }
          done || echo "❌ Python依赖安装失败，但继续执行后续步骤"
          
          echo "🔍 验证关键依赖..."
          python -c "import pytz, yaml, requests" && echo "✅ 关键依赖验证成功" || echo "⚠️  关键依赖验证失败"

      - name: Install Playwright browsers
        run: |
          echo "🌐 安装Playwright浏览器..."
          for i in {1..3}; do
            playwright install --with-deps chromium firefox webkit && break || {
              echo "⚠️  第$i次Playwright安装失败，15秒后重试..."
              sleep 15
            }
          done || echo "❌ Playwright安装失败，但继续执行后续步骤"
          
          echo "✅ Playwright浏览器安装完成"

      - name: Verify dependencies
        run: |
          python -c "import pytz, yaml, requests, playwright"
          
      - name: Verify Playwright browsers
        run: |
          python << 'EOF'
          from playwright.sync_api import sync_playwright
          try:
              with sync_playwright() as p:
                  for browser_type in [p.chromium, p.firefox, p.webkit]:
                      print(f'Testing {browser_type.name}...')
                      browser = browser_type.launch(headless=True)
                      browser.close()
                      print(f'  ✓ {browser_type.name} works')
          except Exception as e:
              print(f'❌ Playwright browser test failed: {e}')
              exit(1)
          EOF

      - name: Verify required files
        run: |
          echo "🔍 检查必需的配置文件..."

          if [ ! -f config/config.yaml ]; then
            echo "❌ 错误: config/config.yaml 文件不存在"
            echo "请参考项目文档创建配置文件"
            exit 1
          fi

          if [ ! -f config/frequency_words.txt ]; then
            echo "❌ 错误: config/frequency_words.txt 文件不存在"
            echo "请参考项目文档创建频率词配置文件"
            exit 1
          fi

          echo "✅ 配置文件检查通过"

      - name: Run crawler
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
          GITHUB_ACTIONS: true
        run: python main.py

      - name: Commit and push if changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update by GitHub Actions at $(TZ=Asia/Shanghai date)" && git push)
